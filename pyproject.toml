[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "12factor-vault"
version = "0.1.23"
description = "Helper classes to integrate Django and other projects with Vault"
readme = { file = "README.rst", content-type = "text/x-rst" }
authors = [
  { name = "Jonas Maurus (@jdelic)", email = "jonas-12factor-vault@gopythongo.com" },
]
maintainers = [
  { name = "GoPythonGo.com", email = "info@gopythongo.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: BSD License",
  "Operating System :: POSIX",
]
urls = { Homepage = "https://github.com/jdelic/12factor-vault/" }
dependencies = [
  "hvac>=0.3.0",  # require at least 0.3.0 because it supports approle authentication
  "django_dbconn_retry>=0.1.5",  # require at least 0.1.5 for changed signal parameters
]

[tool.setuptools]
packages = ["vault12factor"]
